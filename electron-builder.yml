appId: com.ScreenBacon-ce.app
productName: ScreenBacon CE
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,AGENTS.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: out/client-viewer
    to: client-viewer
asarUnpack:
  - resources/**
win:
  artifactName: ${name}-${version}-${arch}.${ext}
  executableName: ScreenBacon CE
  target:
    - portable
    - msi
  azureSignOptions:
    publisherName: "SERVICES DE DÉVELOPPEMENT DE LOGICIELS EFFICACES"
    endpoint: "https://eus.codesigning.azure.net/"
    codeSigningAccountName: "ScreenBacon-web-app"
    certificateProfileName: "ScreenBaconPro"
nsis: null
mac:
  artifactName: ${name}-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo: []
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - rpm
    - deb
    # - snap
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
